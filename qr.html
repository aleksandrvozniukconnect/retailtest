<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-код для наліпки</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top no-print">
    <a href="index.html" class="back">← Усі вироби</a>
    <h1>QR-код для наліпки</h1>
    <p class="muted">Оберіть виріб, надрукуйте наліпку й приклейте на упаковку. Зборщик скануватиме її телефоном.</p>
  </header>

  <main class="container">
    <div class="block no-print">
      <label for="sel">Виріб</label>
      <select id="sel"></select>
      <label for="base">Адреса сайту</label>
      <input id="base" type="url" placeholder="https://ваш-сайт.com/">
      <p class="muted">Адресу підставлено автоматично. Змініть, якщо сайт опубліковано за іншою адресою.</p>
      <button id="print" class="btn" type="button">Друкувати наліпку</button>
    </div>

    <div class="label" id="label">
      <div id="qr" class="qr"></div>
      <div class="label-text">
        <strong id="l-name"></strong>
        <span>Скануйте для інструкції зі збирання</span>
        <small id="l-url"></small>
      </div>
    </div>
  </main>

  <script src="vendor/qrcode.js"></script>
  <script>
    const sel = document.getElementById("sel");
    const base = document.getElementById("base");
    const dir = location.href.replace(/[^/]*$/, "").replace(/\?.*$/, "");
    base.value = dir;
    let items = [];

    function render() {
      const it = items.find(i => i.id === sel.value);
      if (!it) return;
      const url = (base.value.endsWith("/") ? base.value : base.value + "/") + "model.html?id=" + encodeURIComponent(it.id);
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      document.getElementById("l-name").textContent = it.name;
      document.getElementById("l-url").textContent = url;
    }

    fetch("data/models/index.json").then(r => r.json()).then(list => {
      items = list;
      list.forEach(it => sel.add(new Option(it.name, it.id)));
      render();
    });
    sel.addEventListener("change", render);
    base.addEventListener("input", render);
    document.getElementById("print").addEventListener("click", () => window.print());
  </script>
</body>
</html>
